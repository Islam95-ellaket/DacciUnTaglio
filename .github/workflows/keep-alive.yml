name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *" # ogni 10 minuti, così Render free non mette il backend a dormire

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -s -o /dev/null -w "%{http_code}\n" https://dacciuntaglio-api.onrender.com/api/test
